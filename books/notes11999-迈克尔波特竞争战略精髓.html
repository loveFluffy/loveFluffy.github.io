				<h1 id="迈克尔波特竞争战略精髓">迈克尔·波特竞争战略精髓</h1>
<p>老唐：推荐,很多朋友都问过我，关于企业定性方面的研究，需要读什么书？这个答案的首选几乎铁定是竞争战略三部曲：《竞争战略》、《竞争优势》、《国家竞争优势》——来自竞争战略之父、管理思想界“活着的传奇”迈克尔.波特的三部名作。 而这本书，简单的说就是一位细心读者做的读书摘要。它将迈克尔·波特著作的精髓，勾画并摘抄出来。略过一些论证过程、衔接用语，构成一本脱水干货类的学霸笔记。图文并茂、通俗易懂、两小时掌握核心要点</p>
