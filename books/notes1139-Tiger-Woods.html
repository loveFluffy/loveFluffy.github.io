				<h1 id="tiger-woods">Tiger Woods</h1>
<h2 id=""></h2>
<p>泰格·伍兹的父母希望将其培养成一位“暗杀者”：对任何事情无动于衷，也不会对任何事情感到惋惜。永不停歇。胜利是最重要的一件事情。这种抚养方式以及他本人的个人习惯，两者结合在一起塑造出了我们这个时代，也是所有体育竞技项目中最为复杂、争议最大的人物之一。虽然这并非是他对妻子不忠或是据称在高尔夫球比赛中作弊的借口，但却能够解释一二，将其的一生人性化处理。这本书也诠释了为什么技能高超的人在精神以及道德上会出现问题。读者从中可以收获很多教训，引人深思。</p>
