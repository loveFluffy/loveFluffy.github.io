				<h1 id="中国增长之谜">中国增长之谜</h1>
<p>1978年以前，没人预测到中国会是过去30多年里世界上经济发展非常快的国家。今天，很多人都将这个成就归功于1978年开始的改革开放。但是，改革开放只能解释中国经济增长为什么在1978年后快过1978年之前，而不能解释为什么同时也远快过其他国家。而且，绝大多数发展中国家在过去二三十年里也都在不同程度上实行了改革开放政策，很多国家的市场化程度比我们还要高，但为什么没有国家的发展速度超过中国？</p>
